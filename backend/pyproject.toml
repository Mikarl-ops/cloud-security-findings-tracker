[build-system]
requires = ["setuptools>=84.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-security-findings-tracker"
version = "0.1.0"
description = "A synthetic cloud security findings tracker portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Login>=0.6,<1",
  "Flask-Migrate>=4,<5",
  "Flask-Session>=0.8,<1",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-WTF>=1.2,<2",
  "argon2-cffi>=23.1,<26",
  "python-dotenv>=1.2.2,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "setuptools>=84.1,<85",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


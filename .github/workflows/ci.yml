name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies and local package
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint and test the API
        run: |
          python -m ruff check --config pyproject.toml src tests start_dev.py ../scripts
          python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, typecheck, test, and build
        run: |
          npm ls
          npm run lint
          npm run lint:config
          npm run typecheck
          npm test
          npm run build

  contracts:
    name: API contract and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Validate the API contract and documentation
        run: python scripts/validate_contract.py
      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Install verified Terraform 1.17.1
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_linux_amd64.zip \
            --output "$RUNNER_TEMP/terraform.zip"
          echo "4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061  $RUNNER_TEMP/terraform.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/terraform.zip" terraform -d "$RUNNER_TEMP"
      - name: Validate and test Terraform with a mocked AWS provider
        run: |
          "$RUNNER_TEMP/terraform" -chdir=infra/terraform fmt -check -recursive
          "$RUNNER_TEMP/terraform" -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          "$RUNNER_TEMP/terraform" -chdir=infra/terraform validate -no-color
          "$RUNNER_TEMP/terraform" -chdir=infra/terraform test -no-color -var-file=fixtures/offline.tfvars.example
      - name: Install verified Trivy 0.76.1 and check infrastructure
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          "$RUNNER_TEMP/trivy" config --tf-vars infra/terraform/fixtures/offline.tfvars.example \
            --exit-code 0 --timeout 5m infra/terraform
          "$RUNNER_TEMP/trivy" config --tf-vars infra/terraform/fixtures/offline.tfvars.example \
            --severity HIGH,CRITICAL --exit-code 1 --timeout 5m infra/terraform

  compose:
    name: PostgreSQL and Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: tracker-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Generate ephemeral local configuration
        run: |
          python - <<'PY'
          import os
          import secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name in ("POSTGRES_PASSWORD", "SECRET_KEY"):
                  value = secrets.token_hex(32)
                  print("::add-mask::" + value)
                  output.write(name + "=" + value + "\n")
          PY
      - name: Validate, build, and start the stack
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
      - name: Check migrations and synthetic seed idempotence
        run: |
          docker compose exec -T api flask --app tracker:create_app db check
          docker compose exec -T api flask --app tracker:create_app seed-demo | grep -F '0 added, 6 already present'
      - name: Exercise authenticated workflows through the frontend proxy
        run: python scripts/smoke_test.py
      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=100
      - name: Remove the disposable stack and database
        if: always()
        run: docker compose down --volumes --remove-orphans

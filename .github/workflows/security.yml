name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Python static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/requirements-security.txt
      - run: python -m pip install -r scripts/requirements-security.txt
      - name: Reject medium/high severity and confidence code findings
        run: python -m bandit -r backend/src scripts backend/start_dev.py -ll -ii

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: scripts/requirements-security.txt
      - run: |
          python -m pip install -r scripts/requirements-security.txt
          python -m pip check
      - name: Audit the complete application dependency lock
        run: python -m pip_audit --strict --disable-pip --no-deps -r backend/requirements.lock
      - name: Audit the scanner dependency lock
        run: python -m pip_audit --strict --disable-pip --no-deps -r scripts/requirements-security.txt

  npm-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Audit runtime and development dependencies
        run: npm audit --audit-level=moderate --registry=https://registry.npmjs.org

  secrets:
    name: Repository secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1 and scan all fetched history
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts="--all" --exit-code=1 .

  containers:
    name: Container scan (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: backend/Dockerfile
            image: tracker-api:ci
          - service: frontend
            dockerfile: frontend/Dockerfile
            image: tracker-frontend:ci
          - service: db
            dockerfile: database/Dockerfile
            image: tracker-db:ci
    env:
      IMAGE_REF: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the application image
        run: docker build --pull --file "$DOCKERFILE" --tag "$IMAGE_REF" .
      - name: Install verified Trivy 0.76.1
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Reject high and critical image vulnerabilities
        run: >-
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln
          --severity HIGH,CRITICAL --exit-code 1 --no-progress --timeout 5m "$IMAGE_REF"
